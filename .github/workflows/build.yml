name: Build Mod

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          else
            echo "name=dev-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build mod jar
        env:
          MOD_VERSION: ${{ steps.version.outputs.name }}
        run: ./gradlew build

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: moregolems-${{ steps.version.outputs.name }}
          path: build/libs/moregolems-${{ steps.version.outputs.name }}.jar

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: More Golems ${{ steps.version.outputs.name }}
          files: build/libs/moregolems-${{ steps.version.outputs.name }}.jar
          generate_release_notes: true
