modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''More Golems fügt neue Golems hinzu — jeweils analog zum Kupfer-Golem: ein geschnitzter Kürbis auf dem passenden Block lässt den Golem entstehen. Alle Golems sind komplett friedlich und verlassen ihren Arbeitsbereich nicht.

WOLLGOLEM
Rezept: weißer Wollblock, darauf ein geschnitzter Kürbis. Der Wollblock wird dabei zu einer normalen Truhe, auf der der Golem erscheint.
Aussehen: weißer Kupfer-Golem.
Arbeitsweise: schert selbstständig alle scherbereiten Schafe im Umkreis von 10 Blöcken um seine Truhe, sammelt die Wolle (auch lose herumliegende, falls gerade kein Schaf scherbereit ist) ein und legt sie in die Truhe.

KAROTTENGOLEM
Rezept: Truhe, die ausschließlich genau 1 Karotte enthält, darauf ein geschnitzter Kürbis. Die Truhe bleibt erhalten.
Aussehen: oranger Kupfer-Golem.
Arbeitsweise: siehe "FELD-GOLEMS" unten.

KARTOFFELGOLEM
Rezept: Truhe, die ausschließlich genau 1 Kartoffel enthält, darauf ein geschnitzter Kürbis.
Aussehen: hellbrauner Kupfer-Golem.
Arbeitsweise: siehe "FELD-GOLEMS" unten.

ROTE-BETE-GOLEM
Rezept: Truhe, die ausschließlich genau 1 Rote-Bete-Samen enthält (nicht die Rote Bete selbst!), darauf ein geschnitzter Kürbis.
Aussehen: dunkelroter Kupfer-Golem.
Arbeitsweise: siehe "FELD-GOLEMS" unten.

WEIZENGOLEM
Rezept: Truhe, die ausschließlich genau 1 Weizensamen enthält (nicht Weizen selbst!), darauf ein geschnitzter Kürbis.
Aussehen: goldgelber Kupfer-Golem.
Arbeitsweise: siehe "FELD-GOLEMS" unten.

FELD-GOLEMS — gemeinsame Arbeitsweise (Karotte/Kartoffel/Rote Bete/Weizen)
Bewirtschaften die 9x9-Feldfläche um ihre Truhe (max. 4 Blöcke Abstand — derselbe Bereich, den auch ein Wasserblock bewässern würde). Bepflanzen nur bereits vorhandenes Ackerland, pflügen selbst nichts um.
- Erntet ein reifes Feld und bepflanzt die Stelle sofort mit einer der geernteten Samen neu.
- Bepflanzt leere Ackerfelder mit getragenem Pflanzgut.
- Holt bei Bedarf Pflanzgut-Nachschub aus der Truhe, solange noch unbepflanzte Felder übrig sind.
- Legt Ernte-Ertrag (bei Rote Bete/Weizen: das Gemüse bzw. der Weizen selbst) sowie überzähliges Pflanzgut in der Truhe ab, sobald nichts mehr zu tun ist.

BAMBUSGOLEM
Rezept: Truhe, die ausschließlich genau 1 Stück Bambus enthält, darauf ein geschnitzter Kürbis.
Aussehen: grüner Kupfer-Golem.
Arbeitsweise: bewirtschaftet ein 10x10-Feld aus Erdblöcken auf Höhe der Truhe.
- Erntet hochgewachsene Bambus-Stapel, lässt dabei das unterste Segment stehen (wächst von dort weiter nach).
- Sammelt die dabei abgeworfenen sowie sonstige lose herumliegende Bambus-Stücke ein.
- Bepflanzt leere Erdblöcke im Feld mit getragenem Bambus, holt bei Bedarf Nachschub aus der Truhe.
- Legt überzähligen Bambus in der Truhe ab, sobald kein Erdblock im Feld mehr unbepflanzt ist.

MINING-GOLEMS (Erd-, Stein-, Granit-, Diorit-, Andesit-, Tiefenschiefer-, Tuff-, Calcit-, Sand- und Kiesgolem) — gemeinsame Arbeitsweise
Rezept: anders als alle übrigen Golems keine Kiste mit Auslöse-Item, sondern eine ganze Struktur wie beim echten Eisengolem - drei Blöcke des jeweiligen Materials im selben T-Muster wie die drei Eisenblöcke eines Eisengolems, eine Truhe statt eines vierten Materialblocks an der Beine-Position, darauf ein geschnitzter Kürbis. Funktioniert wie beim echten Eisengolem in jeder Ausrichtung. Die Materialblöcke und der Kürbis verschwinden beim Erschaffen, die Truhe bleibt - der Golem steht auf ihr.
Aussehen: wie ein Eisengolem, nur mit dem jeweiligen Material texturiert. Trägt einen abgebauten Block sichtbar vor sich her (wie ein Enderman).
Arbeitsweise: baut sein Material oberhalb seiner Truhen-Ebene in seinem Arbeitsbereich ab und legt es in der Truhe ab - anders als die übrigen Golems keine nachwachsende Ressource, sondern dauerhaftes Terraforming/Abbau.
- Baut nur Blöcke ab, die auf oder über Truhen-Höhe liegen.
- Baut nur Blöcke ab, die direkt exponiert sind (nichts liegt direkt darüber).
- Baut nur Blöcke ab, bei denen dadurch keine Stufe von mehr als 1 Block zu einem Nachbarblock entsteht.
- Wählt immer den nächstgelegenen gültigen Block, bei Gleichstand den nördlichsten, danach den östlichsten.
- Trägt jeweils nur einen Block gleichzeitig, legt ihn in der Truhe ab und holt sich den nächsten.
- Bleibt bei voller Truhe oder ohne aktuelles Ziel bei seiner Truhe stehen, statt umherzuwandern.
- Verschwindet, sobald seine Truhe abgebaut wird (gilt für jeden Golem dieses Mods).

Material je Typ:
- Erdgolem: Erde/Grasblock → liefert Erde (Grasblock droppt wie beim Spieler-Abbau ohne Verzauberung normale Erde). Trägt zusätzlich eine Grasnarbe auf dem Kopf.
- Steingolem: Stein → liefert Kopfsteinpflaster (wie beim Spieler-Abbau ohne Verzauberung).
- Granitgolem: Granit → liefert Granit.
- Dioritgolem: Diorit → liefert Diorit.
- Andesitgolem: Andesit → liefert Andesit.
- Tiefenschiefergolem: Tiefenschiefer → liefert Kopfsteintiefenschiefer (wie beim Spieler-Abbau ohne Verzauberung).
- Tuffgolem: Tuffstein → liefert Tuffstein.
- Calcitgolem: Calcit → liefert Calcit.
- Sandgolem: Sand → liefert Sand.
- Kiesgolem: Kies → liefert Kies (die seltene Feuerstein-Drop-Chance beim Spieler-Abbau wird bewusst nicht nachgebildet).'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
